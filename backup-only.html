<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardar seus dados - Racha</title><style>body{margin:0;background:#0b1220;color:#e8f5ef;font:16px/1.5 system-ui}main{margin:28px 18px;padding:22px;background:#102a23;border:1px solid #29594c;border-radius:20px}h1{font-size:23px;margin:0 0 12px}p{margin:14px 0}button,label{display:block;border-radius:10px;padding:13px;margin-top:18px}button{background:#34d399;color:#073626;border:0;font-weight:700;font-size:15px}label{border:1px dashed #6fa990;cursor:pointer}input{position:absolute;width:1px;height:1px;opacity:0}small{color:#b3cbc0}#file-name{display:block;font-size:13px;overflow-wrap:anywhere;margin-top:8px}</style></head><body><main><h1>Guardar seus dados</h1><p>Abra esta página no mesmo Chrome em que usa o Racha. Ela só salva e confere uma cópia. Não altera o app nem liga a planilha.</p><p id="count"></p><button id="save" disabled>Salvar backup</button><label>Conferir arquivo salvo<span id="file-name">Nenhum arquivo escolhido</span><input id="file" type="file" accept=".json,application/json"></label><p id="result" role="status">Nenhum arquivo conferido.</p><small>O arquivo fica no celular. Não é enviado. Não compartilhe o backup: ele contém seus dados.</small></main><script src="/backup-core.js"></script><script>
let expected=null;const result=t=>document.getElementById('result').textContent=t;
try{const raw=localStorage.getItem('racha_db_v1');if(!raw)throw Error('missing');const x=RachaBackupCore.inspect(raw);document.getElementById('count').textContent='Encontrei '+x.rides+' carona(s) neste Chrome.';document.getElementById('save').disabled=false}catch{result('Não encontrei seus dados aqui. Abra no Chrome original. Nada foi criado ou alterado.')}
document.getElementById('save').onclick=async()=>{try{const raw=localStorage.getItem('racha_db_v1');expected=await RachaBackupCore.digest(raw);const url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='racha-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);result('Salve o arquivo. Depois escolha essa cópia em Conferir arquivo salvo.')}catch{result('Não consegui preparar o backup. Nada foi alterado.')}};
document.getElementById('file').onchange=async e=>{try{const f=e.target.files[0];document.getElementById('file-name').textContent=f?.name||'Nenhum arquivo escolhido';if(!f||!expected||f.size>10000000)throw Error('missing');const raw=await f.text(),hash=await RachaBackupCore.digest(raw);if(hash!==expected||hash!==await RachaBackupCore.digest(localStorage.getItem('racha_db_v1')))throw Error('changed');result('Backup conferido: '+RachaBackupCore.inspect(raw).rides+' carona(s). Seus dados continuam iguais. Guarde esse arquivo e avise o assistente.')}catch{result('Esse arquivo não corresponde aos dados atuais. Salve e confira um novo backup.')}};
</script></body></html>
