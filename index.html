  <script>
(function(){
  var BUILD="20261019-topo1";
  try{
    fetch("/version.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
      if(j&&j.v&&j.v!==BUILD){
        try{if(sessionStorage.getItem("racha_upd_to")===j.v)return;sessionStorage.setItem("racha_upd_to",j.v)}catch(e){}
        var u=location.pathname+location.search;
        u+=(u.indexOf("?")>=0?"&":"?")+"u="+Date.now();
        location.replace(u);
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>

  <style>
html,body{margin:0;background:#0b1220}
#boot{z-index:99999;transition:opacity .6s ease;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#f1f5f9;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#boot .boot-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(52,211,153,.10),transparent 65%);pointer-events:none}
#boot .rs{position:absolute;font-weight:800;line-height:1;color:#34d399;white-space:nowrap;pointer-events:none}
#boot .rs1{font-size:118vw;top:-15vh;left:-120vw;opacity:.92;animation:rs-sweep1 1.6s cubic-bezier(.45,.05,.55,.95) .5s both}
#boot .rs2{font-size:80vw;top:44vh;left:105vw;opacity:.22;animation:rs-sweep2 1.7s cubic-bezier(.45,.05,.55,.95) 2s both}
#boot .rs3{font-size:52vw;top:66vh;left:-55vw;opacity:.1;color:#f1f5f9;animation:rs-sweep3 1.6s cubic-bezier(.45,.05,.55,.95) 2.8s both}
@keyframes rs-sweep1{to{transform:translateX(235vw)}}
@keyframes rs-sweep2{to{transform:translateX(-225vw)}}
@keyframes rs-sweep3{to{transform:translateX(175vw)}}
#boot .boot-content{position:relative;width:100%;max-width:540px;text-align:center;padding:24px;box-sizing:border-box}
#boot .boot-wm{opacity:0;animation:boot-wm .9s cubic-bezier(.2,.65,.3,1) 3.9s both}
#boot h1{margin:0;font-size:clamp(30px,8.2vw,48px);font-weight:800;letter-spacing:-.02em}
#boot h1 .acc{color:#34d399}
#boot .boot-tagline{margin:10px 0 0;font-size:clamp(11px,2.8vw,15px);color:#8496ac;letter-spacing:.18em;text-transform:uppercase}
#boot .boot-bar{height:5px;width:0;max-width:180px;background:#34d399;border-radius:3px;margin:14px auto 0;animation:boot-bar .7s cubic-bezier(.2,.65,.3,1) 4.6s both}
@keyframes boot-wm{from{opacity:0;transform:scale(.78) translateY(26px)}to{opacity:1;transform:none}}
@keyframes boot-bar{to{width:33vw}}
#boot.boot-out{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#boot .rs{animation:none;opacity:0}#boot .boot-wm{animation-duration:.01s;animation-delay:0s}#boot .boot-bar{animation-duration:.01s;animation-delay:0s;width:33vw}}
  </style>

 <body>
  <div id="root"></div>
  <div id="boot" role="status" aria-label="Abrindo Racha Combustível">
<div class="boot-glow" aria-hidden="true"></div>
<span class="rs rs1" aria-hidden="true">R$</span>
<span class="rs rs2" aria-hidden="true">R$</span>
<span class="rs rs3" aria-hidden="true">R$</span>
<div class="boot-content">
    <div class="boot-wm">
      <h1>Racha <span class="acc">Combustível</span></h1>
      <p class="boot-tagline">abasteceu, rachou, rodou</p>
      <div class="boot-bar"></div>
    </div>
  </div>
</div>
  <script>
(function(){
  var MIN=5400,MAX=8000,t0=Date.now(),ok=0;
  function ready(){
    var r=document.getElementById("root");
    if(!r||!r.hasChildNodes())return false;
    var t=(r.textContent||"").replace(/\s+/g,"");
    if(t.length<10)return false;
    if(t.indexOf("Acarregarsistema")>=0)return false;
    return true;
  }
  function hide(){
    var b=document.getElementById("boot");
    if(!b||b.classList.contains("boot-out"))return;
    b.classList.add("boot-out");
    setTimeout(function(){b.remove()},700);
  }
  var iv=setInterval(function(){
    var e=Date.now()-t0;
    if(e>=MAX){clearInterval(iv);hide();return}
    if(e>=MIN&&ready()){ok++;if(ok>=2){clearInterval(iv);hide()}}else{ok=0}
  },50);
})();
</script>
 </body>
