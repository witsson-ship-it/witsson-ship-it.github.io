  <script>
(function(){
  var MIN=1000,MAX=8000,t0=Date.now(),ok=0;
  function ready(){
    var r=document.getElementById("root");
    if(!r||!r.hasChildNodes())return false;
    var t=(r.textContent||"").replace(/\s+/g,"");
    if(t.length<10)return false;
    if(t.indexOf("Acarregarsistema")>=0)return false;
    return true;
  }
  function hide(){
    var b=document.getElementById("boot");
    if(!b||b.classList.contains("boot-out"))return;
    b.classList.add("boot-out");
    setTimeout(function(){b.remove()},700);
  }
  var iv=setInterval(function(){
    var e=Date.now()-t0;
    if(e>=MAX){clearInterval(iv);hide();return}
    if(e>=MIN&&ready()){ok++;if(ok>=2){clearInterval(iv);hide()}}else{ok=0}
  },50);
})();
</script>
